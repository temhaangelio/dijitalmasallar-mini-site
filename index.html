<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <meta
      name="keywords"
      content="dijitalmasallar, teknoloji, bilim, yapay zeka, dijital kültür, dijital medya"
    />
    <meta name="author" content="dijitalmasallar" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="geo.region" content="TR" />
    <meta name="geo.placename" content="Türkiye" />
    <link rel="canonical" href="/" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="tr_TR" />
    <meta property="og:site_name" content="dijitalmasallar" />
    <meta property="og:title" content="dijitalmasallar" />
    <meta
      property="og:description"
      content="Teknoloji, bilim, yapay zeka ve dijital kültür ağırlıklı paylaşımlar yapıyoruz."
    />
    <meta property="og:url" content="/" />
    <meta property="og:image" content="bg.png" />
    <meta property="og:image:alt" content="dijitalmasallar arka plan görseli" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@dijitalmasallar" />
    <meta name="twitter:title" content="dijitalmasallar" />
    <meta
      name="twitter:description"
      content="Teknoloji, bilim, yapay zeka ve dijital kültür ağırlıklı paylaşımlar yapıyoruz."
    />
    <meta name="twitter:image" content="bg.png" />

    <title>dijitalmasallar | Teknoloji, Bilim ve Dijital Kültür</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "dijitalmasallar",
        "url": "/",
        "logo": "logo.png",
        "email": "dijitalmasallar@gmail.com",
        "description": "Teknoloji, bilim, yapay zeka ve dijital kültür ağırlıklı paylaşımlar yapan dijital yayın platformu.",
        "sameAs": [
          "https://www.instagram.com/temhaangelio",
          "https://x.com/dijitalmasallar"
        ]
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "dijitalmasallar",
        "url": "/",
        "inLanguage": "tr-TR",
        "publisher": {
          "@type": "Organization",
          "name": "dijitalmasallar",
          "logo": {
            "@type": "ImageObject",
            "url": "logo.png"
          }
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Montserrat"', 'Arial', 'sans-serif'],
            },
          },
        },
      };
    </script>
    <style>
      :root {
        color-scheme: light;
      }
    </style>
  </head>
  <body class="min-h-screen bg-white font-sans text-neutral-950 antialiased">
    <main class="flex min-h-screen items-center justify-center px-6 py-16">
      <section
        class="flex w-full max-w-md flex-col items-center text-center"
        aria-label="dijitalmasallar kartvizit sayfası"
      >
        <img
          src="logo.png"
          alt="dijitalmasallar logosu"
          class="h-24 w-24 object-contain"
        />

        <h1 class="mt-8 text-3xl font-semibold tracking-tight sm:text-4xl">
          dijitalmasallar
        </h1>

        <p class="mt-4 text-base leading-7 text-neutral-500">
          Teknoloji, bilim, yapay zeka ve dijital kültür ağırlıklı
          paylaşımlar yapıyoruz.
        </p>

        <div class="mt-8 flex items-center gap-2">
          <a
            href="mailto:dijitalmasallar@gmail.com"
            class="text-sm font-medium text-neutral-600 transition hover:text-neutral-950"
          >
            dijitalmasallar@gmail.com
          </a>

          <button
            type="button"
            data-copy-email
            aria-label="E-posta adresini kopyala"
            class="grid h-6 w-6 place-items-center text-neutral-400 transition hover:text-neutral-950"
          >
            <svg
              data-copy-icon
              class="h-4 w-4"
              viewBox="0 0 24 24"
              aria-hidden="true"
              fill="none"
            >
              <rect
                x="8"
                y="8"
                width="11"
                height="11"
                rx="2"
                stroke="currentColor"
                stroke-width="2"
              />
              <path
                d="M5 15V7a2 2 0 0 1 2-2h8"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
            </svg>
            <svg
              data-check-icon
              class="hidden h-4 w-4"
              viewBox="0 0 24 24"
              aria-hidden="true"
              fill="none"
            >
              <path
                d="M5 12.5 9.5 17 19 7"
                stroke="currentColor"
                stroke-width="2.4"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </div>

        <nav class="mt-6 flex items-center gap-4" aria-label="Sosyal medya bağlantıları">
          <a
            href="https://www.instagram.com/temhaangelio"
            aria-label="Instagram"
            target="_blank"
            rel="noopener noreferrer"
            class="grid h-11 w-11 place-items-center rounded-full border border-neutral-200 text-neutral-700 transition hover:border-neutral-950 hover:text-neutral-950"
          >
            <svg class="h-5 w-5" viewBox="0 0 24 24" aria-hidden="true" fill="none">
              <rect
                x="4"
                y="4"
                width="16"
                height="16"
                rx="5"
                stroke="currentColor"
                stroke-width="2"
              />
              <circle cx="12" cy="12" r="3.5" stroke="currentColor" stroke-width="2" />
              <circle cx="17" cy="7" r="1" fill="currentColor" />
            </svg>
          </a>

          <a
            href="https://x.com/dijitalmasallar"
            aria-label="X"
            target="_blank"
            rel="noopener noreferrer"
            class="grid h-11 w-11 place-items-center rounded-full border border-neutral-200 text-neutral-700 transition hover:border-neutral-950 hover:text-neutral-950"
          >
            <svg class="h-5 w-5" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
              <path
                d="M17.64 4h2.94l-6.42 7.34L21.72 20h-5.91l-4.63-5.55L5.88 20H2.93l6.87-7.85L2.56 4h6.06l4.18 5.05L17.64 4Zm-1.03 14.48h1.63L7.73 5.44H5.98l10.63 13.04Z"
              />
            </svg>
          </a>
        </nav>
      </section>
    </main>

    <script>
      const copyButton = document.querySelector("[data-copy-email]");
      const copyIcon = document.querySelector("[data-copy-icon]");
      const checkIcon = document.querySelector("[data-check-icon]");

      copyButton.addEventListener("click", async () => {
        await navigator.clipboard.writeText("dijitalmasallar@gmail.com");
        copyIcon.classList.add("hidden");
        checkIcon.classList.remove("hidden");

        window.setTimeout(() => {
          checkIcon.classList.add("hidden");
          copyIcon.classList.remove("hidden");
        }, 1400);
      });
    </script>
  </body>
</html>
